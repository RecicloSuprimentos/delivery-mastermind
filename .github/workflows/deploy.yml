name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Converter nome da imagem para lowercase
        id: lowercase
        run: echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Configurar QEMU (suporte a múltiplas plataformas)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build e Push da imagem Docker (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PROJECT_ID=${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Build e Push do CRM Receiver
        uses: docker/build-push-action@v5
        with:
          context: ./crm-receiver
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-crm-receiver:latest

      - name: Deploy no VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_PAT,GITHUB_ACTOR,GITHUB_REPOSITORY,SUPABASE_SERVICE_ROLE_KEY
          script: |
            # Exporta a variável para o Swarm usar no compose file
            export SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
            
            # Recria o arquivo roterizador-stack.yml no VPS para incluir a nova variável
            cat << 'EOF' > ~/roterizador-stack.yml
            version: '3.8'
            services:
              app:
                image: ghcr.io/reciclosuprimentos/delivery-mastermind:latest
                environment:
                  - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
                networks:
                  - web
                deploy:
                  replicas: 1
                  update_config:
                    parallelism: 1
                    delay: 10s
                    order: start-first
                    failure_action: rollback
                  restart_policy:
                    condition: on-failure
                    delay: 5s
                    max_attempts: 3
                  labels:
                    - "traefik.enable=true"
                    - "traefik.http.routers.roterizador.rule=Host(`roterizador.mgbase.com.br`)"
                    - "traefik.http.routers.roterizador.entrypoints=websecure"
                    - "traefik.http.routers.roterizador.tls.certresolver=myresolver"
                    - "traefik.http.services.roterizador.loadbalancer.server.port=80"
                    - "traefik.http.routers.roterizador-http.rule=Host(`roterizador.mgbase.com.br`)"
                    - "traefik.http.routers.roterizador-http.entrypoints=web"
                    - "traefik.http.routers.roterizador-http.middlewares=roterizador-redirect-https"
                    - "traefik.http.middlewares.roterizador-redirect-https.redirectscheme.scheme=https"
                    - "traefik.http.middlewares.roterizador-redirect-https.redirectscheme.permanent=true"
              crm-receiver:
                image: ghcr.io/reciclosuprimentos/delivery-mastermind-crm-receiver:latest
                environment:
                  - SUPABASE_URL=https://supabase.mgbase.com.br
                  - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
                networks:
                  - web
                deploy:
                  replicas: 1
                  restart_policy:
                    condition: on-failure
                    delay: 5s
                    max_attempts: 3
                  labels:
                    - "traefik.enable=true"
                    - "traefik.http.routers.crm-receiver.rule=Host(`roterizador.mgbase.com.br`) && PathPrefix(`/webhook`)"
                    - "traefik.http.routers.crm-receiver.entrypoints=websecure"
                    - "traefik.http.routers.crm-receiver.tls.certresolver=myresolver"
                    - "traefik.http.routers.crm-receiver.priority=10"
                    - "traefik.http.services.crm-receiver.loadbalancer.server.port=3001"
            networks:
              web:
                external: true
            EOF
            
            # Login no ghcr.io com PAT dedicado (read:packages)
            echo "$GHCR_PAT" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            # Puxa as imagens atualizadas
            docker pull ghcr.io/$GITHUB_REPOSITORY:latest
            docker pull ghcr.io/$GITHUB_REPOSITORY-crm-receiver:latest

            # Faz deploy do stack completo para aplicar a nova configuração
            docker stack deploy --with-registry-auth -c ~/roterizador-stack.yml roterizador

            # Força atualização do crm-receiver para usar a nova imagem
            docker service update --image ghcr.io/$GITHUB_REPOSITORY-crm-receiver:latest --with-registry-auth roterizador_crm-receiver

            # Status final
            sleep 15
            docker service ps roterizador_app --format "table {{.Name}}\t{{.CurrentState}}\t{{.Error}}"
            docker service ps roterizador_crm-receiver --format "table {{.Name}}\t{{.CurrentState}}\t{{.Error}}"
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
